<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>本地 F3D 导入</title>
<style>
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    margin: 12px;
    color: #333;
    background: #fafafa;
  }
  h3 { margin: 0 0 8px; font-size: 14px; }
  p  { font-size: 12px; line-height: 1.6; margin: 6px 0; }
  button {
    width: 100%;
    padding: 8px 12px;
    border: 0;
    border-radius: 4px;
    background: #1e88e5;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover  { background: #1976d2; }
  button:active { background: #1565c0; }
  #status { color: #555; word-break: break-all; }
</style>
</head>
<body>
<h3>本地 F3D 导入</h3>
<p>把本地 .f3d 文件插入到当前设计的根零部件。</p>
<button onclick="importF3D()">选择 F3D 文件并导入</button>
<p id="status"></p>
<script>
    function importF3D() {
        // 通知 Fusion 侧的 PaletteHTMLEventHandler（action = 'import'）
        adsk.fusionSendData('import', '');
    }

    // 接收 Fusion 侧 sendInfoToHTML 推送的消息
    window.fusionJavaScriptHandler = {
        handle: function (action, data) {
            if (action === 'status') {
                document.getElementById('status').innerText = data;
                return true;
            }
            if (action === 'autoimport') {
                // 延迟触发：等按钮的命令事件完全退出后再导入，
                // 否则导入机制检测到活动命令会报 Internal validation error
                setTimeout(importF3D, 500);
                return true;
            }
            if (action === 'import') {
                importF3D();
                return true;
            }
            return false;
        }
    };
</script>
</body>
</html>
